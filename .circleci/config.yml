version: 2.1

jobs:
  contractCb:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Copy the assay plate from region a to staging
          command: |
            mkdir -p /tmp/data-03
            { set +o pipefail 2>/dev/null; ls -1tn --time-style=+%Y-%m-%d_%H:%M /etc/host* | tail -5; true ; } > /tmp/data-03/48464bbe-1750-761c
            echo "gate tweak-dashboard-redirect: $(wc -c </tmp/data-03/48464bbe-1750-761c) bytes total"
      - persist_to_workspace:
          root: /tmp/data-03
          paths:
            - '48464bbe-1750-761c'
  tweak-dashboard-redirect:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/data-03
      - run:
          name: Receive handoff data
          command: |
            cat /tmp/data-03/48464bbe-1750-761c
      - run:
          name: Retrieve repository
          command: git clone -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: tar -I bzip2 -xf sources.tar.bz2
      - run:
          name: Package artifacts
          command: g++ --version
      - run:
          command: env | wc -l
      - run:
          command: "./runtime"
